<html lang="en">
<head>

    <title>Phantom Chess — Board</title>
    <link rel="stylesheet" href="style.css">

    <script type="module"
    src="https://unpkg.com/chessboard-element?module">
    </script>

    import { Chess } from
    "https://cdnjs.cloudflare.com/ajax/libs/chess.js/1.0.0/chess.js";

    <style>

        <div class="board-container">
