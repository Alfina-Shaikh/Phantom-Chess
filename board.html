<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Chess — Board</title>
    <link rel="stylesheet" href="style.css">

    <script type="module"
    src="https://unpkg.com/chessboard-element?module">
    </script>
    <script type="module">
    import { Chess } from
    "https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm";

    const game = new Chess();
    const board = document.querySelector("#chessboard");

    // Only allow the player whose turn it is
    board.addEventListener("drag-start", (event) => {
        const piece = event.detail.piece;

        if (
            game.isGameOver() ||
            (game.turn() === "w" && piece.startsWith("b")) ||
            (game.turn() === "b" && piece.startsWith("w"))
        ) {
            event.preventDefault();
        }
    });

    // Check whether the move is legal
    board.addEventListener("drop", (event) => {
        const { source, target, setAction } = event.detail;

        try {
            game.move({
                from: source,
                to: target,
                promotion: "q"
            });
        } catch (error) {
            setAction("snapback");
        }
    });

    // Update the board after a move
    board.addEventListener("snap-end", () => {
        board.setPosition(game.fen());
    });
    </script>
    <style>
        .board-container {
            width: min(92vw, 500px);
            margin: 25px auto;
        }

        chess-board {
            display: block;
            width: 100%;
        }

        .board-screen {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <main class="board-screen">

        <h1>PHANTOM CHESS</h1>

        <p class="tagline">Every piece has a secret</p>

        <div class="board-container">
            <chess-board
    id="chessboard"
    position="start"
    draggable-pieces>
</chess-board>
        </div>

        <button onclick="window.location.href='bot.html'">
            Back to Bot Setup
        </button>

    </main>

</body>
</html>
